name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an older run when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Sanity project ID / dataset defaults live in sanity/env.ts, so the build
      # needs no repo variables or secrets.
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
